name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Build exe
        run: pyinstaller --onefile --name LlamaToolkit --paths src --collect-data llamatoolkit scripts/entry.py

      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item README.txt dist/
          Compress-Archive -Path dist/LlamaToolkit.exe, dist/README.txt -DestinationPath LlamaToolkit.zip

      - uses: actions/upload-artifact@v4
        with:
          name: LlamaToolkit
          path: LlamaToolkit.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LlamaToolkit.zip
          generate_release_notes: true
